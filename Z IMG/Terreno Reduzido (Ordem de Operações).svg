<svg viewBox="0 0 1140 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terreno reduzido dos setores de estudo">
<rect x="0" y="0" width="1140" height="620" fill="#cdbd8f"/>
      <defs>
        <radialGradient id="hillShade" cx="35%" cy="30%" r="75%">
          <stop offset="0%" stop-color="rgba(255,255,255,.35)"/>
          <stop offset="100%" stop-color="rgba(0,0,0,.18)"/>
        </radialGradient>
        <pattern id="contourPattern" width="1140" height="620" patternUnits="userSpaceOnUse">
        </pattern>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#454d24"/>
        </marker>
      </defs>

      <!-- terrain contour rings (decorative topography) -->
      <g fill="none" stroke="rgba(74,58,26,.35)" stroke-width="1.2">
        <ellipse cx="570" cy="310" rx="520" ry="270"/>
        <ellipse cx="570" cy="310" rx="430" ry="220"/>
        <ellipse cx="570" cy="310" rx="340" ry="175"/>
        <ellipse cx="570" cy="310" rx="250" ry="130"/>
        <ellipse cx="220" cy="120" rx="150" ry="80"/>
        <ellipse cx="950" cy="150" rx="130" ry="70"/>
        <ellipse cx="180" cy="500" rx="160" ry="80"/>
        <ellipse cx="960" cy="500" rx="150" ry="80"/>
      </g>

      <!-- FLOT: linha de contato (fronteira entre alvo e território a conquistar) -->
      <line x1="30" y1="190" x2="1110" y2="190" stroke="#a13324" stroke-width="1.4" stroke-dasharray="9 6" opacity=".55"/>
      <text x="1108" y="182" text-anchor="end" font-family="IBM Plex Mono" font-size="11" fill="#a13324" opacity=".8">LINHA DE CONTATO — ALTO GANHO</text>

      <!-- rota semanal: dia a dia, cada cor um dia -->
      <g stroke-width="2.2" fill="none" opacity=".8" marker-end="url(#arrow)">
        <!-- Segunda: Cont.Avançada(155,150) -> Dir.Trib(560,150) -> Lingua Port(880,470) -> Fluencia(950,150) -->
        <path d="M155,150 L555,150" stroke="#c0392b" stroke-dasharray="2 5"/>
        <path d="M560,158 L875,462" stroke="#c0392b" stroke-dasharray="2 5"/>
        <path d="M885,462 L945,158" stroke="#c0392b" stroke-dasharray="2 5"/>
        <!-- Quarta: MatFin(300,320) -> Cont.Avançada(155,150) -> Dir.Financeiro(300,480) -->
        <path d="M300,320 L165,160" stroke="#8e44ad" stroke-dasharray="2 5"/>
        <path d="M155,160 L295,470" stroke="#8e44ad" stroke-dasharray="2 5"/>
        <!-- Sexta: Dir.Trib(560,150) -> Financas(650,340) -> MatFin(300,320) -->
        <path d="M560,160 L645,332" stroke="#16a085" stroke-dasharray="2 5"/>
        <path d="M640,335 L310,322" stroke="#16a085" stroke-dasharray="2 5"/>
      </g>

      <!-- ============ SETORES (hills) ============ -->
      <!-- Tier alvo (frente): ganho alto -->
      <g id="setores">
        <!-- Legislação Tributária: ganho 14.0, pts 40, pct 50% amostra minima -->
        <g transform="translate(560,150)">
          <ellipse rx="62" ry="48" fill="#a97a2a" fill-opacity=".85"/>
          <ellipse rx="62" ry="48" fill="url(#hillShade)"/>
          <ellipse rx="62" ry="48" fill="none" stroke="#454d24" stroke-width="1.5"/>
          <text y="-4" text-anchor="middle" font-family="Archivo Narrow" font-weight="700" font-size="13" fill="#241f14">Legislação</text>
          <text y="12" text-anchor="middle" font-family="Archivo Narrow" font-weight="700" font-size="13" fill="#241f14">Tributária</text>
          <text y="28" text-anchor="middle" font-family="IBM Plex Mono" font-size="10" fill="#241f14">40pts · 2q · 50%</text>
        </g>

        <!-- Cont. Avançada e de Custos: ganho 8.86 -->
        <g transform="translate(155,150)">
          <ellipse rx="58" ry="46" fill="#a97a2a" fill-opacity=".85"/>
          <ellipse rx="58" ry="46" fill="url(#hillShade)"/>
          <ellipse rx="58" ry="46" fill="none" stroke="#454d24" stroke-width="1.5"/>
          <text y="-4" text-anchor="middle" font-family="Archivo Narrow" font-weight="700" font-size="12" fill="#241f14">Cont. Avançada</text>
          <text y="12" text-anchor="middle" font-family="Archivo Narrow" font-weight="700" font-size="12" fill="#241f14">e de Custos</text>
          <text y="28" text-anchor="middle" font-family="IBM Plex Mono" font-size="10" fill="#241f14">40pts · 35q · 63%</text>
        </g>

        <!-- Adm. e Governança: ganho 8.50, sem dado -->
        <g transform="translate(430,110)">
          <ellipse rx="44" ry="36" fill="#9a988c" fill-opacity=".85"/>
          <ellipse rx="44" ry="36" fill="url(#hillShade)"/>
          <ellipse rx="44" ry="36" fill="none" stroke="#454d24" stroke-width="1.4" stroke-dasharray="3 3"/>
          <text y="-3" text-anchor="middle" font-family="Archivo Narrow" font-weight="700" font-size="10.5" fill="#241f14">Adm. e</text>
          <text y="10" text-anchor="middle" font-family="Archivo Narrow" font-weight="700" font-size="10.5" fill="#241f14">Governança</text>
          <text y="24" text-anchor="middle" font-family="IBM Plex Mono" font-size="9" fill="#241f14">10pts · sem dado</text>
        </g>

        <!-- Economia: ganho 8.50, sem dado -->
        <g transform="translate(950,150)">
          <ellipse rx="44" ry="36" fill="#9a988c" fill-opacity=".85"/>
          <ellipse rx="44" ry="36" fill="url(#hillShade)"/>
          <ellipse rx="44" ry="36" fill="none" stroke="#454d24" stroke-width="1.4" stroke-dasharray="3 3"/>
          <text y="-3" text-anchor="middle" font-family="Archivo Narrow" font-weight="700" font-size="12" fill="#241f14">Economia</text>
          <text y="13" text-anchor="middle" font-family="IBM Plex Mono" font-size="9" fill="#241f14">10pts · sem dado</text>
        </g>

        <!-- Direito Financeiro: ganho 6.80, sem dado -->
        <g transform="translate(300,480)">
          <ellipse rx="40" ry="33" fill="#9a988c" fill-opacity=".85"/>
          <ellipse rx="40" ry="33" fill="url(#hillShade)"/>
          <ellipse rx="40" ry="33" fill="none" stroke="#454d24" stroke-width="1.4" stroke-dasharray="3 3"/>
          <text y="-3" text-anchor="middle" font-family="Archivo Narrow" font-weight="700" font-size="10.5" fill="#241f14">Direito</text>
          <text y="10" text-anchor="middle" font-family="Archivo Narrow" font-weight="700" font-size="10.5" fill="#241f14">Financeiro</text>
          <text y="23" text-anchor="middle" font-family="IBM Plex Mono" font-size="8.5" fill="#241f14">8pts · sem dado</text>
        </g>

        <!-- Direito Tributário: ganho 5.09, pct 72% -->
        <g transform="translate(560,340)">
          <ellipse rx="70" ry="55" fill="#4c6b52" fill-opacity=".55"/>
          <ellipse rx="70" ry="55" fill="url(#hillShade)"/>
          <ellipse rx="70" ry="55" fill="none" stroke="#454d24" stroke-width="1.6"/>
          <text y="-5" text-anchor="middle" font-family="Archivo Narrow" font-weight="700" font-size="14" fill="#eef3ea">Direito</text>
          <text y="13" text-anchor="middle" font-family="Archivo Narrow" font-weight="700" font-size="14" fill="#eef3ea">Tributário</text>
          <text y="30" text-anchor="middle" font-family="IBM Plex Mono" font-size="10.5" fill="#eef3ea">40pts · 119q · 72%</text>
        </g>

        <!-- Mat. Fin/Estat/RLM: ganho 5.06, pct 43% — ALVO interno CASP/RLM/Estatistica -->
        <g transform="translate(300,320)">
          <ellipse rx="60" ry="48" fill="#a13324" fill-opacity=".5"/>
          <ellipse rx="60" ry="48" fill="url(#hillShade)"/>
          <ellipse rx="60" ry="48" fill="none" stroke="#454d24" stroke-width="1.6"/>
          <text y="-6" text-anchor="middle" font-family="Archivo Narrow" font-weight="700" font-size="11.5" fill="#241f14">Mat.Fin. /</text>
          <text y="8" text-anchor="middle" font-family="Archivo Narrow" font-weight="700" font-size="11.5" fill="#241f14">Estat. / RLM</text>
          <text y="24" text-anchor="middle" font-family="IBM Plex Mono" font-size="10" fill="#241f14">12pts · 21q · 43%</text>
          <!-- alvo secundário crosshair -->
          <g transform="translate(-38,30)" stroke="#a13324" stroke-width="1.6">
            <circle r="8" fill="none"/>
            <line x1="-11" y1="0" x2="11" y2="0"/>
            <line x1="0" y1="-11" x2="0" y2="11"/>
          </g>
        </g>

        <!-- Língua Portuguesa: ganho 3.50, pct 50% -->
        <g transform="translate(880,470)">
          <ellipse rx="42" ry="34" fill="#a13324" fill-opacity=".4"/>
          <ellipse rx="42" ry="34" fill="url(#hillShade)"/>
          <ellipse rx="42" ry="34" fill="none" stroke="#454d24" stroke-width="1.4"/>
          <text y="-3" text-anchor="middle" font-family="Archivo Narrow" font-weight="700" font-size="10.5" fill="#241f14">Língua</text>
          <text y="10" text-anchor="middle" font-family="Archivo Narrow" font-weight="700" font-size="10.5" fill="#241f14">Portuguesa</text>
          <text y="23" text-anchor="middle" font-family="IBM Plex Mono" font-size="9" fill="#241f14">10pts · 4q · 50%</text>
        </g>

        <!-- Fluência de Dados: ganho 3.45, pct 68% -->
        <g transform="translate(950,340)">
          <ellipse rx="55" ry="44" fill="#4c6b52" fill-opacity=".45"/>
          <ellipse rx="55" ry="44" fill="url(#hillShade)"/>
          <ellipse rx="55" ry="44" fill="none" stroke="#454d24" stroke-width="1.5"/>
          <text y="-5" text-anchor="middle" font-family="Archivo Narrow" font-weight="700" font-size="12" fill="#eef3ea">Fluência</text>
          <text y="11" text-anchor="middle" font-family="Archivo Narrow" font-weight="700" font-size="12" fill="#eef3ea">de Dados</text>
          <text y="27" text-anchor="middle" font-family="IBM Plex Mono" font-size="9.5" fill="#eef3ea">20pts · 121q · 68%</text>
        </g>

        <!-- Finanças Públicas: ganho 3.34, pct 68% -->
        <g transform="translate(650,470)">
          <ellipse rx="46" ry="37" fill="#4c6b52" fill-opacity=".4"/>
          <ellipse rx="46" ry="37" fill="url(#hillShade)"/>
          <ellipse rx="46" ry="37" fill="none" stroke="#454d24" stroke-width="1.4"/>
          <text y="-3" text-anchor="middle" font-family="Archivo Narrow" font-weight="700" font-size="10.5" fill="#241f14">Finanças</text>
          <text y="10" text-anchor="middle" font-family="Archivo Narrow" font-weight="700" font-size="10.5" fill="#241f14">Públicas</text>
          <text y="23" text-anchor="middle" font-family="IBM Plex Mono" font-size="9" fill="#241f14">20pts · 41q · 68%</text>
        </g>

        <!-- Cont. Geral e Pública: ganho 2.28, pct 62% — ALVO interno CASP -->
        <g transform="translate(180,500)">
          <ellipse rx="46" ry="37" fill="#4c6b52" fill-opacity=".35"/>
          <ellipse rx="46" ry="37" fill="url(#hillShade)"/>
          <ellipse rx="46" ry="37" fill="none" stroke="#454d24" stroke-width="1.4"/>
          <text y="-3" text-anchor="middle" font-family="Archivo Narrow" font-weight="700" font-size="9.5" fill="#241f14">Cont. Geral</text>
          <text y="9" text-anchor="middle" font-family="Archivo Narrow" font-weight="700" font-size="9.5" fill="#241f14">e Pública</text>
          <text y="21" text-anchor="middle" font-family="IBM Plex Mono" font-size="8.5" fill="#241f14">10pts · 90q · 62%</text>
          <g transform="translate(34,-26)" stroke="#a13324" stroke-width="1.5">
            <circle r="7" fill="none"/>
            <line x1="-10" y1="0" x2="10" y2="0"/>
            <line x1="0" y1="-10" x2="0" y2="10"/>
          </g>
        </g>

        <!-- Const/Adm/Civil/Penal: ganho 2.16, pct 67% -->
        <g transform="translate(960,500)">
          <ellipse rx="48" ry="39" fill="#4c6b52" fill-opacity=".4"/>
          <ellipse rx="48" ry="39" fill="url(#hillShade)"/>
          <ellipse rx="48" ry="39" fill="none" stroke="#454d24" stroke-width="1.4"/>
          <text y="-10" text-anchor="middle" font-family="Archivo Narrow" font-weight="700" font-size="9.5" fill="#241f14">Const./Adm./</text>
          <text y="2" text-anchor="middle" font-family="Archivo Narrow" font-weight="700" font-size="9.5" fill="#241f14">Civil/Penal</text>
          <text y="15" text-anchor="middle" font-family="IBM Plex Mono" font-size="9" fill="#241f14">12pts · 106q · 67%</text>
        </g>

        <!-- Auditoria: ganho 1.88, pct 62% -->
        <g transform="translate(80,340)">
          <ellipse rx="40" ry="33" fill="#4c6b52" fill-opacity=".55"/>
          <ellipse rx="40" ry="33" fill="url(#hillShade)"/>
          <ellipse rx="40" ry="33" fill="none" stroke="#454d24" stroke-width="1.4"/>
          <text y="-2" text-anchor="middle" font-family="Archivo Narrow" font-weight="700" font-size="11" fill="#eef3ea">Auditoria</text>
          <text y="14" text-anchor="middle" font-family="IBM Plex Mono" font-size="9" fill="#eef3ea">8pts · 52q · 62%</text>
        </g>
      </g>

      <!-- rosa dos ventos -->
      <g transform="translate(1075,555)" font-family="IBM Plex Mono">
        <circle r="26" fill="none" stroke="#454d24" stroke-width="1.3"/>
        <line x1="0" y1="-22" x2="0" y2="22" stroke="#454d24" stroke-width="1"/>
        <line x1="-22" y1="0" x2="22" y2="0" stroke="#454d24" stroke-width="1"/>
        <text y="-28" text-anchor="middle" font-size="10" fill="#454d24">N</text>
      </g>

      <!-- escala -->
      <g transform="translate(40,585)" font-family="IBM Plex Mono" font-size="9" fill="#4a4326">
        <line x1="0" y1="0" x2="90" y2="0" stroke="#4a4326" stroke-width="1.5"/>
        <line x1="0" y1="-4" x2="0" y2="4" stroke="#4a4326" stroke-width="1.5"/>
        <line x1="90" y1="-4" x2="90" y2="4" stroke="#4a4326" stroke-width="1.5"/>
        <text x="0" y="16">0</text>
        <text x="70" y="16">10 pts de peso</text>
      </g>
    </svg>